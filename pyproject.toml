[project]
name = "hig-mcp"
version = "0.2.0"
description = "Structured Apple HIG design-system MCP: tokens, Liquid Glass constraints, SwiftUI mapping. Prose via sosumi.ai."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nica Iliuchina (aka-kika)" }]
keywords = [
    "mcp", "model-context-protocol", "apple", "hig",
    "human-interface-guidelines", "design-tokens", "liquid-glass",
    "swiftui", "claude", "ai-agents",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: User Interfaces",
]
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=2.0.0,<3",
    "httpx>=0.27",
]

[project.scripts]
hig-mcp = "hig_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hig_mcp"]
# data/*.json ship automatically as part of the package (src/hig_mcp now has
# __init__.py). The old force-include here double-added them and broke the build.

[project.urls]
Repository = "https://github.com/aka-kika/hig-mcp"
Issues = "https://github.com/aka-kika/hig-mcp/issues"
